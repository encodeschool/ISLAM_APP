name: Deploy Backend to VDS

on:
  push:
    branches: [ main, project ]
    paths:
      - 'backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/services

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests

      # ✅ Rename JAR (important for stability)
      - name: Rename JAR
        run: mv target/*.jar app.jar

      # 📦 Upload to server
      - name: Copy to VDS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "backend/services/app.jar"
          target: "~/farzuz/backend/services"

      # 🔁 Restart app
      - name: Restart app on VDS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd ~/farzuz/backend/services

            echo "Stopping old app..."
            pkill -f app.jar || true

            echo "Starting new app..."
            nohup java -jar app.jar > log.txt 2>&1 &

            echo "Deployment done!"