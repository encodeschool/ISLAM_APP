name: Deploy Website to VDS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website/farz-website

    steps:
      # 1️⃣ Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Setup Node with cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: website/farz-website/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build the React project (ignore CI warnings)
      - name: Build project
        run: CI=false npm run build

      # 5️⃣ Clean old frontend folder on VDS
      - name: Clean old build on VDS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            echo "Cleaning old frontend folder..."
            rm -rf ~/farzuz/website/farz-website
            mkdir -p ~/farzuz/website/farz-website

      # 6️⃣ Upload new build to VDS
      - name: Copy build to VDS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "website/farz-website/build"
          target: "~/farzuz/website/farz-website"

      # 7️⃣ Reload Nginx safely
      - name: Reload Nginx
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            echo "Reloading Nginx..."
            sudo systemctl reload nginx
            echo "Frontend deployed successfully!"