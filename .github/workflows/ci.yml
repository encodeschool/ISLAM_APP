name: CI + Deploy Pipeline

on:
  push:
    branches: [ main ]

jobs:

  # -------------------------
  # ☕ BACKEND (Spring Boot)
  # -------------------------
  backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/services

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Rename JAR
        run: mv target/*.jar app.jar

      # 📦 Upload backend to VDS
      - name: Copy backend to VDS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "backend/services/app.jar"
          target: "~/farzuz/backend/services"

      # 🔁 Restart backend safely
      - name: Restart backend service
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            echo "Restarting backend..."
            sudo systemctl restart farzuz-backend
            sudo systemctl status farzuz-backend --no-pager
            echo "Backend deployed!"

  # -------------------------
  # 🌐 WEBSITE (React)
  # -------------------------
  website:
    name: Build & Deploy Website
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website/farz-website

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 🔹 Setup Node with proper cache
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: website/farz-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: CI=false npm run build

      # 🧹 Clean old frontend build on VDS
      - name: Clean old build on VDS
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            echo "Cleaning old frontend build..."
            rm -rf ~/farzuz/website/farz-website/build

      # 📦 Upload new build to VDS
      - name: Copy frontend to VDS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "website/farz-website/build"
          target: "~/farzuz/website/farz-website"

      # 🔁 Reload Nginx to serve new build
      - name: Reload Nginx
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            echo "Reloading Nginx..."
            sudo systemctl reload nginx
            echo "Frontend deployed successfully!"